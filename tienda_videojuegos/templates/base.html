{% load static %}

<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Tienda de Videojuegos {% endblock %}</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    
    <!-- Iconos Modo Claro/Oscuro -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="bg-body text-body">
    <!-- Botón Modo Oscuro/Claro -->
   <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
            <div class="container">
                <a class="navbar-brand" href="{% url 'home' %}">
                🎮 Tienda de Videojuegos
             </a>

             <button
                id="theme-toggle"
                class="btn btn-outline-secondary rounded-circle"
                type="button">

                <i class="fa-solid fa-moon theme-icon"></i>

            </button>
            </div>
        </nav>
    </header>

    <main class="container py-4">
        {% block content %}

    <!--Acá irá el contenido específico de cada página-->

        {% endblock %}
    </main>

    <footer class="text-center mt-5 mb-3">
        <p>© 2026 Tienda de Videojuegos</p>
        <a href="{% url 'home' %}" class="text-body">Inicio</a>
        <a href="{% url 'contacto' %}" class="text-body ms-3">Contacto</a>
    </footer>
    
    <!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/script.js' %}"></script>

</body>
</html>
